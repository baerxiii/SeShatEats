<!DOCTYPE html>
<html lang="en"><head><link rel="icon" href="favicon.ico?v=2" type="image/x-icon"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Food curator — SeShatEats</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><link rel="stylesheet" href="css/style.css"></head>
<body><nav aria-label="Main navigation"><a href="index.html">🍎 SeShatEats</a><a href="search.html">Search</a><a href="diary.html">Diary</a><a href="recipes.html">Recipes</a></nav><header><p>CANADIAN FOOD DATABASE</p><h1>Canadian food curator</h1><p>Browse your imported Canadian food data. Food Search includes these items and restaurant dishes.</p></header><section class="card"><label for="search">Search Canadian foods</label><input id="search" type="search" placeholder="Search foods…"><button type="button" onclick="searchFoods()">Search</button><p id="status" role="status"></p></section><main id="results" aria-live="polite"></main>
<script>function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function searchFoods(){const q=document.getElementById('search').value.trim();if(q.length<2){document.getElementById('status').textContent='Enter at least 2 characters.';return;}const {data,error}=await supabaseClient.from('canada_foods').select('id,category,item_name,calories,protein_g,carbs_g,fat_g,serving_measure,weight_g').ilike('item_name',`%${q}%`).limit(50);if(error){document.getElementById('status').textContent=error.message;return;}document.getElementById('status').textContent=`${data.length} result(s)`;document.getElementById('results').innerHTML=(data||[]).map(f=>`<article class="card"><span class="badge">🇨🇦 Canada</span><h2>${esc(f.item_name)}</h2><p>${esc(f.category||'')} · ${esc(f.serving_measure||'serving')}${Number(f.weight_g)>0?` · ${Number(f.weight_g)} g`:''}</p><p>${Number(f.calories||0)} kcal · Protein ${Number(f.protein_g||0)}g · Carbs ${Number(f.carbs_g||0)}g · Fat ${Number(f.fat_g||0)}g</p></article>`).join('')||'<p>No foods found.</p>';}document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')searchFoods();});</script></body></html>
