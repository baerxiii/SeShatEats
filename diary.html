<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Diary</title>

<style>

body{
    font-family:'Segoe UI',sans-serif;
    background:#f3f6fb;
    margin:0;
    padding:20px;
    color:#334155;
}

.container{
    max-width:1200px;
    margin:auto;
}

/* NAV */

.navbar{
    background:white;
    border-radius:16px;
    padding:14px 20px;
    display:flex;
    gap:20px;
    margin-bottom:25px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.navbar a{
    text-decoration:none;
    color:#475569;
    font-weight:600;
}

.navbar a.active{
    color:#176b48;
}

/* DATE PICKER */

.header{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin-bottom:30px;
}

.header button{
    border:none;
    background:#176b48;
    color:white;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
}

.header button:hover{
    background:#14543a;
}

#diaryDate{
    padding:10px;
    border-radius:10px;
    border:1px solid #d1d5db;
    font-size:16px;
}

/* SUMMARY CARDS */

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.card{
    padding:20px;
    border-radius:18px;
    color:white;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.card h3{
    margin:0;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:1px;
    opacity:.9;
}

.value{
    margin-top:10px;
    font-size:34px;
    font-weight:bold;
}

.calories{
    background:linear-gradient(135deg,#ff9800,#ff5722);
}

.protein{
    background:linear-gradient(135deg,#2ecc71,#27ae60);
}

.carbs{
    background:linear-gradient(135deg,#3498db,#2980b9);
}

.fat{
    background:linear-gradient(135deg,#9b59b6,#8e44ad);
}

/* MEALS */

.meal{
    background:white;
    padding:20px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.meal-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #eee;
    padding-bottom:10px;
    margin-bottom:10px;
}

.meal-title h2{
    margin:0;
}

.meal-calories{
    color:#64748b;
    font-size:14px;
}

.food-item{
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.food-item:last-child{
    border-bottom:none;
}

.food-name{
    font-weight:600;
    margin-bottom:4px;
}

.food-macros{
    color:#64748b;
    font-size:14px;
}

.empty-state{
    color:#94a3b8;
    padding:15px 0;
    text-align:center;
}

/* MOBILE */

@media(max-width:768px){

    .summary{
        grid-template-columns:1fr 1fr;
    }

    .navbar{
        flex-wrap:wrap;
    }

}

</style>

</head>

<body>

<body>

<nav class="navbar">

    <a href="index.html">
        🏠 Dashboard
    </a>

    <a href="search.html">
        🔍 Search
    </a>

    <a href="diary.html" class="active">
        📖 Diary
    </a>

    <a href="recipes.html">
        🍲 Recipes
    </a>

</nav>

<div class="container">

    <div class="page-header">

        <h1>
            Food Diary
        </h1>

        <p>
            Review your meals and nutrition history.
        </p>

    </div>

    <div class="header">

        <button id="prevDayBtn">
            ◀
        </button>

        <input
            type="date"
            id="diaryDate"
        >

        <button id="nextDayBtn">
            ▶
        </button>

    </div>

    <div class="summary">

        <div class="card calories">

            <div class="label">
                Calories
            </div>

            <div
                class="value"
                id="totalCalories"
            >
                0
            </div>

        </div>

        <div class="card protein">

            <div class="label">
                Protein
            </div>

            <div
                class="value"
                id="totalProtein"
            >
                0g
            </div>

        </div>

        <div class="card carbs">

            <div class="label">
                Carbs
            </div>

            <div
                class="value"
                id="totalCarbs"
            >
                0g
            </div>

        </div>

        <div class="card fat">

            <div class="label">
                Fat
            </div>

            <div
                class="value"
                id="totalFat"
            >
                0g
            </div>

        </div>

    </div>

    <div class="meal">

        <div class="meal-title">

            <h2>☀️ Breakfast</h2>

            <span
                id="breakfastCalories"
                class="meal-calories"
            >
                0 cal
            </span>

        </div>

        <div id="breakfastFoods">

            <div class="empty-state">
                No breakfast logged
            </div>

        </div>

    </div>

    <div class="meal">

        <div class="meal-title">

            <h2>🥪 Lunch</h2>

            <span
                id="lunchCalories"
                class="meal-calories"
            >
                0 cal
            </span>

        </div>

        <div id="lunchFoods">

            <div class="empty-state">
                No lunch logged
            </div>

        </div>

    </div>

    <div class="meal">

        <div class="meal-title">

            <h2>🍽️ Dinner</h2>

            <span
                id="dinnerCalories"
                class="meal-calories"
            >
                0 cal
            </span>

        </div>

        <div id="dinnerFoods">

            <div class="empty-state">
                No dinner logged
            </div>

        </div>

    </div>

    <div class="meal">

        <div class="meal-title">

            <h2>🍎 Snacks</h2>

            <span
                id="snackCalories"
                class="meal-calories"
            >
                0 cal
            </span>

        </div>

        <div id="snackFoods">

            <div class="empty-state">
                No snacks logged
            </div>

        </div>

    </div>

</div>

<script type="module">

/*
Paste your existing Supabase diary JavaScript here.

The IDs are unchanged:

prevDayBtn
nextDayBtn
diaryDate

totalCalories
totalProtein
totalCarbs
totalFat

breakfastFoods
lunchFoods
dinnerFoods
snackFoods

NEW:
breakfastCalories
lunchCalories
dinnerCalories
snackCalories
*/

</script>

</body>
</html>
