<div class="diary-page">

    <div class="diary-header">

        <button id="prevDayBtn">
            ◀
        </button>

        <div class="date-container">

            <input
                type="date"
                id="diaryDate"
            >

        </div>

        <button id="nextDayBtn">
            ▶
        </button>

    </div>

    <div class="quick-nav">

        <button data-days="0">
            Today
        </button>

        <button data-days="-1">
            Yesterday
        </button>

        <button id="weekViewBtn">
            Last 7 Days
        </button>

    </div>

    <div class="daily-summary">

        <div class="summary-card">

            <h3>Calories</h3>

            <div id="totalCalories">
                0
            </div>

        </div>

        <div class="summary-card">

            <h3>Protein</h3>

            <div id="totalProtein">
                0g
            </div>

        </div>

        <div class="summary-card">

            <h3>Carbs</h3>

            <div id="totalCarbs">
                0g
            </div>

        </div>

        <div class="summary-card">

            <h3>Fat</h3>

            <div id="totalFat">
                0g
            </div>

        </div>

    </div>

    <div class="meal-section">

        <h2>Breakfast</h2>

        <div
            id="breakfastFoods"
            class="meal-list"
        ></div>

    </div>

    <div class="meal-section">

        <h2>Lunch</h2>

        <div
            id="lunchFoods"
            class="meal-list"
        ></div>

    </div>

    <div class="meal-section">

        <h2>Dinner</h2>

        <div
            id="dinnerFoods"
            class="meal-list"
        ></div>

    </div>

    <div class="meal-section">

        <h2>Snacks</h2>

        <div
            id="snackFoods"
            class="meal-list"
        ></div>

    </div>

</div>
