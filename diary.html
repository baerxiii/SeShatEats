<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Today's diary — SeShatEats</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/nutrition.js"></script><link rel="stylesheet" href="css/style.css"></head>
<body><nav aria-label="Main navigation"><a href="index.html">🍎 SeShatEats</a><a href="search.html">Search</a><a href="diary.html" aria-current="page">Diary</a><a href="recipes.html">Recipes</a></nav><header><p>YOUR FOOD JOURNAL</p><h1>Today's diary</h1><p>Canadian foods and restaurant servings, together in one view.</p></header><section class="card" id="authPanel" aria-live="polite">Checking account…</section><section id="totals" aria-label="Daily nutrition totals"><strong>Calories <span id="calories">0</span></strong> · Protein <span id="protein">0</span>g · Carbs <span id="carbs">0</span>g · Fat <span id="fat">0</span>g</section><main id="foods" aria-live="polite">Loading…</main>
<script>
renderAuthPanel('authPanel');const meals=['Breakfast','Lunch','Dinner','Snack'];function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function loadDiary(){const {data:s,error:se}=await supabase.auth.getSession(),user=s?.session?.user;if(se){document.getElementById('foods').textContent=se.message;return;}if(!user){document.getElementById('foods').textContent='Sign in above to see your personal diary.';return;}const date=localDateKey();const {data:logs,error}=await supabaseClient.from('food_logs').select('id,servings,meal_type,canada_food_id,restaurant_food_id,food_id,canada_foods(item_name,category,calories,protein_g,carbs_g,fat_g,weight_g,serving_measure),restaurant_foods(restaurant,item_name,calories,protein_g,carbs_g,fat_g,serving_size,source_url)').eq('user_id',user.id).eq('log_date',date).order('created_at',{ascending:true});if(error){document.getElementById('foods').textContent=`Could not load entries: ${error.message}`;return;}const {data:recipeLogs,error:recipeError}=await supabaseClient.from('recipe_logs').select('id,recipe_id,servings,meal_type').eq('log_date',date);if(recipeError)console.error(recipeError);const totals={calories:0,protein:0,carbs:0,fat:0},grouped=Object.fromEntries(meals.map(m=>[m,[]]));(logs||[]).forEach(log=>{const restaurant=log.restaurant_foods,food=restaurant||log.canada_foods,meal=meals.includes(log.meal_type)?log.meal_type:'Snack';if(!food){if(log.food_id)grouped[meal].push(`<article class="card"><strong>Legacy food entry</strong><p>Old catalogue ID ${Number(log.food_id)} · nutrition unavailable. <a href="search.html">Search for a Canadian replacement</a>.</p><button class="delete-btn" onclick="deleteLog(${Number(log.id)})">Remove old entry</button></article>`);return;}const amount=Number(log.servings||1),macros=scaledNutrition(food,amount);addNutrition(totals,macros);const portion=restaurant?(food.serving_size||'menu serving'):(Number(food.weight_g)>0?`${food.serving_measure||'serving'} · ${food.weight_g} g`:'100 g assumed');const label=restaurant?`<span class="badge">${esc(food.restaurant||'Restaurant')}</span>`:'<span class="badge">Canada</span>';const source=restaurant&&food.source_url?` · <a href="${esc(food.source_url)}" target="_blank" rel="noopener noreferrer">Source ↗</a>`:'';grouped[meal].push(`<article class="card"><div class="button-row">${label}<strong>${esc(food.item_name)}</strong></div><p>${amount} × ${esc(portion)} · ${Math.round(macros.calories)} kcal · Protein ${macros.protein.toFixed(1)}g · Carbs ${macros.carbs.toFixed(1)}g · Fat ${macros.fat.toFixed(1)}g${source}</p><button class="serving-btn" onclick="changeServing(${Number(log.id)},-.5)">− ½</button> <button class="serving-btn" onclick="changeServing(${Number(log.id)},.5)">+ ½</button> <button class="delete-btn" onclick="deleteLog(${Number(log.id)})">Remove</button></article>`);});const recipeIds=[...new Set((recipeLogs||[]).map(r=>r.recipe_id).filter(Boolean))];if(recipeIds.length){const {recipes,error:e}=await loadCanadianRecipeTotals(recipeIds);if(e)console.error('Could not calculate Canadian recipe totals:',e);for(const log of recipeLogs||[]){const recipe=recipes.get(String(log.recipe_id));if(!recipe)continue;const amount=Number(log.servings||1),macros=scaledNutrition(recipe,amount/Number(recipe.servings||1)),meal=meals.includes(log.meal_type)?log.meal_type:'Snack';addNutrition(totals,macros);grouped[meal].push(`<article class="card"><span class="badge">Recipe</span><h2>${esc(recipe.recipe_name)}</h2><p>${amount} serving(s) · ${Math.round(macros.calories)} kcal · Protein ${macros.protein.toFixed(1)}g${recipe.legacyIngredients?` · ${recipe.legacyIngredients} old ingredient(s) excluded from totals`:''}</p><button class="delete-btn" onclick="deleteRecipeLog(${Number(log.id)})">Remove</button></article>`);}}document.getElementById('foods').innerHTML=meals.map((m,i)=>`<section class="meal-section"><h2>${['🍳','🥪','🍽️','🍎'][i]} ${m}</h2>${grouped[m].join('')||'<p class="card">Nothing logged yet.</p>'}</section>`).join('');document.getElementById('calories').textContent=Math.round(totals.calories);document.getElementById('protein').textContent=totals.protein.toFixed(1);document.getElementById('carbs').textContent=totals.carbs.toFixed(1);document.getElementById('fat').textContent=totals.fat.toFixed(1);}
async function changeServing(id,d){const {data,error}=await supabaseClient.from('food_logs').select('servings').eq('id',id).single();if(error)return alert(error.message);const {error:e}=await supabaseClient.from('food_logs').update({servings:Math.max(.25,Number(data.servings||1)+d)}).eq('id',id);if(e)return alert(e.message);loadDiary();}async function deleteLog(id){const {error}=await supabaseClient.from('food_logs').delete().eq('id',id);if(error)return alert(error.message);loadDiary();}async function deleteRecipeLog(id){const {error}=await supabaseClient.from('recipe_logs').delete().eq('id',id);if(error)return alert(error.message);loadDiary();}loadDiary();supabase.auth.onAuthStateChange(()=>loadDiary());
</script></body></html>
