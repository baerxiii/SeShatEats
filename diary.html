<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Diary</title>

<style>

body{
    font-family:'Segoe UI',sans-serif;
    background:#f3f6fb;
    margin:0;
    padding:20px;
    color:#334155;
}

.container{
    max-width:1200px;
    margin:auto;
}

.page-header{
    margin-bottom:25px;
}

.page-header h1{
    margin:0;
}

.page-header p{
    color:#64748b;
}

.navbar{

    background:white;

    border-radius:16px;

    padding:14px 20px;

    display:flex;

    gap:20px;

    margin-bottom:25px;

    box-shadow:
        0 4px 12px rgba(
            0,0,0,.08
        );

}

.navbar a{

    text-decoration:none;

    color:#475569;

    font-weight:600;

}

.navbar a.active{

    color:#176b48;

}

.header{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:12px;

    margin-bottom:30px;

}

.header button{

    border:none;

    background:#176b48;

    color:white;

    padding:10px 16px;

    border-radius:10px;

    cursor:pointer;

}

.header button:hover{

    background:#14543a;

}

#diaryDate{

    padding:10px;

    border-radius:10px;

    border:1px solid #d1d5db;

    font-size:16px;

}

.summary{

    display:grid;

    grid-template-columns:
        repeat(
            4,
            1fr
        );

    gap:15px;

    margin-bottom:25px;

}

.card{

    color:white;

    border-radius:20px;

    padding:20px;

    box-shadow:
        0 6px 14px rgba(
            0,0,0,.12
        );

}

.label{

    font-size:13px;

    text-transform:uppercase;

    opacity:.9;

}

.value{

    margin-top:10px;

    font-size:36px;

    font-weight:bold;

}

.calories{

    background:
        linear-gradient(
            135deg,
            #ff9800,
            #ff5722
        );

}

.protein{

    background:
        linear-gradient(
            135deg,
            #2ecc71,
            #27ae60
        );

}

.carbs{

    background:
        linear-gradient(
            135deg,
            #3498db,
            #2980b9
        );

}

.fat{

    background:
        linear-gradient(
            135deg,
            #9b59b6,
            #8e44ad
        );

}

.meal{

    background:white;

    border-radius:20px;

    padding:20px;

    margin-bottom:20px;

    box-shadow:
        0 4px 12px rgba(
            0,0,0,.08
        );

}

.meal-title{

    display:flex;

    justify-content:space-between;

    align-items:center;

    border-bottom:1px solid #eee;

    padding-bottom:12px;

    margin-bottom:12px;

}

.meal-title h2{

    margin:0;

}

.meal-calories{

    color:#64748b;

    font-size:14px;

}

.food-item{

    padding:12px 0;

    border-bottom:1px solid #eee;

}

.food-item:last-child{

    border-bottom:none;

}

.food-name{

    font-weight:600;

}

.food-macros{

    color:#64748b;

    font-size:14px;

}

.empty-state{

    color:#94a3b8;

    text-align:center;

    padding:10px;

}

@media(max-width:768px){

    .summary{

        grid-template-columns:
            1fr 1fr;

    }

}
</style>

</head>

<body>

<body>

<nav class="navbar">

    <a href="index.html">
        🏠 Dashboard
    </a>

    <a href="search.html">
        🔍 Search
    </a>

    <a href="diary.html" class="active">
        📖 Diary
    </a>

    <a href="recipes.html">
        🍲 Recipes
    </a>

</nav>

<div class="container">

    <div class="page-header">

        <h1>
            Food Diary
        </h1>

        <p>
            Review your meals and nutrition history.
        </p>

    </div>

    <div class="header">

        <button id="prevDayBtn">
            ◀
        </button>

        <input
            type="date"
            id="diaryDate"
        >

        <button id="nextDayBtn">
            ▶
        </button>

    </div>

    <div class="summary">

        <div class="card calories">

            <div class="label">
                Calories
            </div>

            <div
                class="value"
                id="totalCalories"
            >
                0
            </div>

        </div>

        <div class="card protein">

            <div class="label">
                Protein
            </div>

            <div
                class="value"
                id="totalProtein"
            >
                0g
            </div>

        </div>

        <div class="card carbs">

            <div class="label">
                Carbs
            </div>

            <div
                class="value"
                id="totalCarbs"
            >
                0g
            </div>

        </div>

        <div class="card fat">

            <div class="label">
                Fat
            </div>

            <div
                class="value"
                id="totalFat"
            >
                0g
            </div>

        </div>

    </div>

    <div class="meal">

        <div class="meal-title">

            <h2>☀️ Breakfast</h2>

            <span
                id="breakfastCalories"
                class="meal-calories"
            >
                0 cal
            </span>

        </div>

        <div id="breakfastFoods">

            <div class="empty-state">
                No breakfast logged
            </div>

        </div>

    </div>

    <div class="meal">

        <div class="meal-title">

            <h2>🥪 Lunch</h2>

            <span
                id="lunchCalories"
                class="meal-calories"
            >
                0 cal
            </span>

        </div>

        <div id="lunchFoods">

            <div class="empty-state">
                No lunch logged
            </div>

        </div>

    </div>

    <div class="meal">

        <div class="meal-title">

            <h2>🍽️ Dinner</h2>

            <span
                id="dinnerCalories"
                class="meal-calories"
            >
                0 cal
            </span>

        </div>

        <div id="dinnerFoods">

            <div class="empty-state">
                No dinner logged
            </div>

        </div>

    </div>

    <div class="meal">

        <div class="meal-title">

            <h2>🍎 Snacks</h2>

            <span
                id="snackCalories"
                class="meal-calories"
            >
                0 cal
            </span>

        </div>

        <div id="snackFoods">

            <div class="empty-state">
                No snacks logged
            </div>

        </div>

    </div>

</div>

<script type="module">


import {
    createClient
}
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL =
"YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
"YOUR_SUPABASE_ANON_KEY";

const supabase =
createClient(
    "https://uzbbwvihkfzdbnowhglc.supabase.co",
    "sb_publishable_a6YEwdDOpkZ6BI8pHXVPnQ_WlFMlHmf"
);

const diaryDate =
document.getElementById(
    "diaryDate"
);

const today = new Date();

today.setMinutes(
    today.getMinutes()
    - today.getTimezoneOffset()
);

diaryDate.value =
    today
        .toISOString()
        .split("T")[0];

//
// Date Navigation
//

document
.getElementById("prevDayBtn")
.addEventListener(
"click",
() => {

    const d =
    new Date(
        diaryDate.value
    );

    d.setDate(
        d.getDate() - 1
    );

    diaryDate.value =
    d.toISOString()
    .split("T")[0];

    loadDiary();

});

document
.getElementById("nextDayBtn")
.addEventListener(
"click",
() => {

    const d =
    new Date(
        diaryDate.value
    );

    d.setDate(
        d.getDate() + 1
    );

    diaryDate.value =
    d.toISOString()
    .split("T")[0];

    loadDiary();

});

diaryDate.addEventListener(
    "change",
    loadDiary
);

//
// Diary Loader
//

async function loadDiary(){

    const date =
    diaryDate.value;

    const {

        data,
        error

    } = await supabase

    .from("food_logs")

            .select(`
    *,
    canada_foods(
        item_name,
        calories,
        protein_g,
        carbs_g,
        fat_g
    ),
    restaurant_foods(
        item_name,
        calories,
        protein_g,
        carbs_g,
        fat_g,
        restaurant
    )
`)

    .eq(
        "food_date",
        date
    )

    .order(
        "created_at",
        {
            ascending:true
        }
    );

    if(error){

        console.error(error);

        return;
    }

    renderDiary(
        data || []
    );

}

//
// Render
//

function renderDiary(data){

    const breakfast =
    document.getElementById(
        "breakfastFoods"
    );

    const lunch =
    document.getElementById(
        "lunchFoods"
    );

    const dinner =
    document.getElementById(
        "dinnerFoods"
    );

    const snack =
    document.getElementById(
        "snackFoods"
    );

    breakfast.innerHTML = "";
    lunch.innerHTML = "";
    dinner.innerHTML = "";
    snack.innerHTML = "";

    let calories = 0;
    let protein = 0;
    let carbs = 0;
    let fat = 0;

    let breakfastTotal = 0;
let lunchTotal = 0;
let dinnerTotal = 0;
let snackTotal = 0;

    data.forEach(food => {

        const f =
    food.restaurant_foods ||
    food.canada_foods;

if(!f){
    return;
}

     const servings =
    Number(food.servings || 1);

const displayCalories =
    Number(f.calories || 0) *
    servings;

const displayProtein =
    Number(f.protein_g || 0) *
    servings;

const displayCarbs =
    Number(f.carbs_g || 0) *
    servings;

const displayFat =
    Number(f.fat_g || 0) *
    servings;

calories += displayCalories;

protein += displayProtein;

carbs += displayCarbs;

fat += displayFat;

        const div =
        document.createElement(
            "div"
        );

        div.className =
        "food-item";


        
        div.innerHTML = `

    <div class="food-name">

        ${f.item_name}

    </div>

    <div class="food-macros">

    const servings =
    Number(food.servings || 1);

const displayCalories =
    Number(f.calories || 0) *
    servings;

const displayProtein =
    Number(f.protein_g || 0) *
    servings;

const displayCarbs =
    Number(f.carbs_g || 0) *
    servings;

const displayFat =
    Number(f.fat_g || 0) *
    servings;

        ${Math.round(displayCalories)} cal

·

P ${displayProtein.toFixed(1)}g

·

C ${displayCarbs.toFixed(1)}g

·

F ${displayFat.toFixed(1)}g

    </div>

`;

        const meal =
(
    food.meal_type || ""
)
.toLowerCase();

        const servings =
    Number(food.servings || 1);

const itemCalories =
    Number(f.calories || 0) * servings;

if(meal === "breakfast"){

    breakfast.appendChild(div);

    breakfastTotal += itemCalories;

}
else if(meal === "lunch"){

    lunch.appendChild(div);

    lunchTotal += itemCalories;

}
else if(meal === "dinner"){

    dinner.appendChild(div);

    dinnerTotal += itemCalories;

}
else{

    snack.appendChild(div);

    snackTotal += itemCalories;

}

    });

    document.getElementById(
        "totalCalories"
    ).innerText =
    Math.round(calories);

    document.getElementById(
        "totalProtein"
    ).innerText =
    Math.round(protein) + "g";

    document.getElementById(
        "totalCarbs"
    ).innerText =
    Math.round(carbs) + "g";

    document.getElementById(
        "totalFat"
    ).innerText =
    Math.round(fat) + "g";

    document.getElementById(
    "breakfastCalories"
).innerText =
Math.round(breakfastTotal) + " cal";

document.getElementById(
    "lunchCalories"
).innerText =
Math.round(lunchTotal) + " cal";

document.getElementById(
    "dinnerCalories"
).innerText =
Math.round(dinnerTotal) + " cal";

document.getElementById(
    "snackCalories"
).innerText =
Math.round(snackTotal) + " cal";


}

loadDiary();


</script>

</body>
</html>
