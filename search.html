<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search foods — SeShatEats</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .search-controls { display: grid; gap: 12px; }
    .food-card { display: grid; gap: 12px; }
    .food-meta { color: var(--muted); }
    .source-badge { display: inline-block; padding: 3px 9px; border-radius: 999px; background: var(--mint); color: var(--green-dark); font-size: .82rem; font-weight: 700; }
    .macros { display: grid; grid-template-columns: repeat(4, minmax(80px, 1fr)); gap: 10px; }
    .macro { text-align: center; }
    .macro strong { display: block; }
    @media (max-width: 560px) { .macros { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <nav aria-label="Main navigation"><a href="index.html">🍎 SeShatEats</a>　<a href="diary.html">Diary</a>　<a href="recipes.html">Recipes</a></nav>
  <header><p>USDA + RESTAURANT FOODS</p><h1>Find foods</h1></header>
  <section class="card search-controls">
    <label for="search">Search by food or restaurant</label>
    <input id="search" type="search" placeholder="Try ‘burger’, ‘Tim Hortons’…" autocomplete="off">
    <label for="sourceFilter">Search in</label>
    <select id="sourceFilter"><option value="all">All foods</option><option value="usda">USDA foods</option><option value="restaurant">Restaurant foods</option></select>
    <label for="mealType">Add to meal</label>
    <select id="mealType"><option value="Breakfast">🍳 Breakfast</option><option value="Lunch" selected>🥪 Lunch</option><option value="Dinner">🍽 Dinner</option><option value="Snack">🍎 Snack</option></select>
    <p id="status" aria-live="polite">Type at least 2 characters to search both catalogs.</p>
  </section>
  <main id="results" aria-live="polite"></main>
<script>
  const searchBox = document.getElementById('search');
  const resultsDiv = document.getElementById('results');
  const statusDiv = document.getElementById('status');
  let searchTimer;
  let lastSearch = 0;
  searchBox.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(searchFoods, 250); });
  document.getElementById('sourceFilter').addEventListener('change', searchFoods);

  function escapeHtml(value = '') {
    return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
  }
  function number(value) { const result = Number(value); return Number.isFinite(result) ? result : 0; }

  async function searchFoods() {
    const query = searchBox.value.trim();
    const run = ++lastSearch;
    if (query.length < 2) { resultsDiv.replaceChildren(); statusDiv.textContent = 'Type at least 2 characters to search both catalogs.'; return; }
    const pattern = `%${query}%`;
    const source = document.getElementById('sourceFilter').value;
    statusDiv.textContent = 'Searching…';
    const tasks = [];
    if (source !== 'restaurant') {
      tasks.push(supabaseClient.from('usda_foods').select('id, item_name, calories, protein_g, carbs_g, fat_g').ilike('item_name', pattern).limit(30).then(result => ({ source: 'USDA', ...result })));
    }
    if (source !== 'usda') {
      tasks.push(supabaseClient.from('restaurant_foods').select('id, restaurant, category, item_name, calories, protein_g, carbs_g, fat_g, serving_size, sodium_mg, sugars_g, fiber_g, saturated_fat_g, cholesterol_mg, source_url').eq('active', true).or(`item_name.ilike.${pattern},restaurant.ilike.${pattern}`).limit(50).then(result => ({ source: 'Restaurant', ...result })));
    }
    const responses = await Promise.all(tasks);
    if (run !== lastSearch) return;
    const failures = responses.filter(result => result.error);
    if (failures.length) console.error('Food search errors:', failures.map(result => `${result.source}: ${result.error.message}`));
    const foods = responses.flatMap(result => (result.data || []).map(food => ({ ...food, source: result.source })))
      .sort((a, b) => a.item_name.localeCompare(b.item_name));
    statusDiv.textContent = failures.length === responses.length
      ? `Search failed: ${failures.map(result => result.error.message).join('; ')}`
      : `${foods.length} result(s)${failures.length ? ' (some sources could not be searched)' : ''}`;
    resultsDiv.innerHTML = foods.map(food => `
      <article class="card food-card">
        <div><span class="source-badge">${food.source === 'Restaurant' ? 'Restaurant' : 'USDA'}</span></div>
        <h2>${escapeHtml(food.item_name)}</h2>
        ${food.source === 'Restaurant' ? `<div class="food-meta">${escapeHtml(food.restaurant || '')}${food.category ? ` · ${escapeHtml(food.category)}` : ''}${food.serving_size ? ` · ${escapeHtml(food.serving_size)}` : ''}</div>` : '<div class="food-meta">Nutrition per 100 g</div>'}
        <div class="macros">
          <div class="macro">Calories<strong>${number(food.calories)}</strong></div>
          <div class="macro">Protein<strong>${number(food.protein_g)}g</strong></div>
          <div class="macro">Carbs<strong>${number(food.carbs_g)}g</strong></div>
          <div class="macro">Fat<strong>${number(food.fat_g)}g</strong></div>
        </div>
        ${food.source === 'Restaurant' && food.source_url ? `<a href="${escapeHtml(food.source_url)}" target="_blank" rel="noopener noreferrer">Nutrition source</a>` : ''}
        <button type="button" onclick="addFood('${food.source}', ${Number(food.id)})">➕ Add to diary</button>
      </article>`).join('') || '<section class="card"><p>No matching foods found.</p></section>';
  }

  async function addFood(source, id) {
    const table = source === 'Restaurant' ? 'restaurant_foods' : 'usda_foods';
    const { data: food, error: foodError } = await supabaseClient.from(table).select('id, item_name').eq('id', id).single();
    if (foodError) return alert(`Could not load food: ${foodError.message}`);
    const entry = { servings: 1, meal_type: document.getElementById('mealType').value };
    if (source === 'Restaurant') entry.restaurant_food_id = food.id;
    else entry.food_id = food.id;
    const { error } = await supabaseClient.from('food_logs').insert(entry);
    if (error) return alert(`Could not add food to diary: ${error.message}`);
    statusDiv.textContent = `${food.item_name} added to your diary.`;
  }

  const queryFromUrl = new URLSearchParams(location.search).get('query');
  if (queryFromUrl) { searchBox.value = queryFromUrl; searchFoods(); }
</script>
</body>
</html>
