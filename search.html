<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeShatEats Search</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
    background:#f9f9f9;
}

h1{
    color:#2e7d32;
}

a{
    font-weight:bold;
    color:#2e7d32;
    text-decoration:none;
}

#search{
    width:100%;
    padding:12px;
    font-size:18px;
    border-radius:8px;
    border:1px solid #ccc;
    margin-bottom:15px;
}

.food-card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.macros{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:10px;
}

.macro{
    background:#f1f1f1;
    padding:10px;
    border-radius:8px;
    text-align:center;
}

button{
    background:#2e7d32;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

#status{
    margin-top:10px;
    color:#666;
}

</style>
</head>
<body>

<a href="index.html">🏠 Dashboard</a>
|
<a href="diary.html">📋 Diary</a>

<h1>SeShatEats</h1>

<input
    id="search"
    type="text"
    placeholder="Search foods..."
>

<br><br>

<select id="mealType">

    <option value="Breakfast">
        🍳 Breakfast
    </option>

    <option value="Lunch" selected>
        🥪 Lunch
    </option>

    <option value="Dinner">
        🍽 Dinner
    </option>

    <option value="Snack">
        🍎 Snack
    </option>

</select>

<div id="status">
    Type at least 2 characters to search.
</div>

<br>

<div id="results"></div>

<script>

const searchBox =
    document.getElementById("search");

searchBox.addEventListener(
    "input",
    searchFoods
);

async function searchFoods(){

    const query =
        searchBox.value.trim();

    const resultsDiv =
        document.getElementById("results");

    const statusDiv =
        document.getElementById("status");

    if(query.length < 2){

        resultsDiv.innerHTML = "";

        statusDiv.innerHTML =
            "Type at least 2 characters to search.";

        return;
    }

    statusDiv.innerHTML =
        "Searching...";

    const { data, error } =
        await supabaseClient
            .from("usda_foods")
            .select("*")
            .ilike(
                "item_name",
                `${query}%`
            )
            .limit(25);

    if(error){

        console.error(error);

        statusDiv.innerHTML =
            "Search failed.";

        return;
    }

    statusDiv.innerHTML =
        `${data.length} food(s) found`;

    let html = "";

    data.forEach(food => {

        html += `
        <div class="food-card">

            <strong>
                ${food.item_name}
            </strong>

            <br><br>

            <div class="macros">

                <div class="macro">
                    Calories<br>
                    <strong>${food.calories ?? 0}</strong>
                </div>

                <div class="macro">
                    Protein<br>
                    <strong>${food.protein_g ?? 0}g</strong>
                </div>

                <div class="macro">
                    Carbs<br>
                    <strong>${food.carbs_g ?? 0}g</strong>
                </div>

                <div class="macro">
                    Fat<br>
                    <strong>${food.fat_g ?? 0}g</strong>
                </div>

            </div>

            <br>

            <button
                onclick="addFood(${food.id})"
            >
                ➕ Add To Diary
            </button>

        </div>
        `;
    });

    resultsDiv.innerHTML = html;
}

async function addFood(foodId){

    const { data: food, error: foodError } =
        await supabaseClient
            .from("usda_foods")
            .select("*")
            .eq("id", foodId)
            .single();

    if(foodError){

        console.error(foodError);

        alert("Could not find food.");

        return;
    }

    const mealType =
        document.getElementById(
            "mealType"
        ).value;

    const { error } =
        await supabaseClient
            .from("food_logs")
            .insert({
                food_id: food.id,
                servings: 1,
                meal_type: mealType
            });

    if(error){

        console.error(error);

        alert("Failed to add food.");

        return;
    }

    alert(
        `${food.item_name} added to ${mealType}`
    );
}

</script>

</body>
</html>
