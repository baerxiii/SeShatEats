<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search foods — SeShatEats</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="index.html">🍎 SeShatEats</a>　<a href="diary.html">Diary</a>　<a href="recipes.html">Recipes</a>
  </nav>

  <header>
    <p>SEARCH YOUR FOOD LIBRARY</p>
    <h1>Find foods</h1>
  </header>

  <section class="card">
    <label for="search">Food name</label>
    <input id="search" type="search" placeholder="Search foods…" autocomplete="off">
    <label for="mealType">Add to meal</label>
    <select id="mealType">
      <option value="Breakfast">🍳 Breakfast</option>
      <option value="Lunch" selected>🥪 Lunch</option>
      <option value="Dinner">🍽 Dinner</option>
      <option value="Snack">🍎 Snack</option>
    </select>
    <p id="status" aria-live="polite">Type at least 2 characters to search.</p>
  </section>

  <main id="results" aria-live="polite"></main>

  <script>
    const searchBox = document.getElementById('search');
    const resultsDiv = document.getElementById('results');
    const statusDiv = document.getElementById('status');

    function escapeHtml(value = '') {
      return String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[character]));
    }

    let searchTimer;
    searchBox.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(searchFoods, 250);
    });

    async function searchFoods() {
      const query = searchBox.value.trim();
      if (query.length < 2) {
        resultsDiv.replaceChildren();
        statusDiv.textContent = 'Type at least 2 characters to search.';
        return;
      }

      statusDiv.textContent = 'Searching…';
      const { data, error } = await supabaseClient
        .from('usda_foods')
        .select('id, item_name, calories, protein_g, carbs_g, fat_g')
        .ilike('item_name', `${query}%`)
        .limit(25);

      if (error) {
        console.error(error);
        statusDiv.textContent = `Search failed: ${error.message}`;
        return;
      }

      statusDiv.textContent = `${(data || []).length} food(s) found`;
      resultsDiv.innerHTML = (data || []).map(food => `
        <article class="card">
          <h2>${escapeHtml(food.item_name)}</h2>
          <div class="macros">
            <div class="macro">Calories<br><strong>${Number(food.calories || 0)}</strong></div>
            <div class="macro">Protein<br><strong>${Number(food.protein_g || 0)}g</strong></div>
            <div class="macro">Carbs<br><strong>${Number(food.carbs_g || 0)}g</strong></div>
            <div class="macro">Fat<br><strong>${Number(food.fat_g || 0)}g</strong></div>
          </div>
          <p><button type="button" onclick="addFood(${Number(food.id)})">➕ Add to diary</button></p>
        </article>
      `).join('');
    }

    async function addFood(foodId) {
      const { data: food, error: foodError } = await supabaseClient
        .from('usda_foods')
        .select('id, item_name')
        .eq('id', foodId)
        .single();
      if (foodError) {
        alert(`Could not find food: ${foodError.message}`);
        return;
      }

      const { error } = await supabaseClient.from('food_logs').insert({
        food_id: food.id,
        servings: 1,
        meal_type: document.getElementById('mealType').value
      });
      if (error) {
        alert(`Failed to add food: ${error.message}`);
        return;
      }

      statusDiv.textContent = `${food.item_name} added to your diary.`;
    }

    const queryFromUrl = new URLSearchParams(location.search).get('query');
    if (queryFromUrl) {
      searchBox.value = queryFromUrl;
      searchFoods();
    }
  </script>
</body>
</html>
