<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search foods — SeShatEats</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/nutrition.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .search-toolbar { display: grid; gap: 14px; }
    .search-status { color: var(--muted); font-weight: 600; }
    .food-card .meta { display: grid; grid-template-columns: repeat(4, minmax(110px, 1fr)); gap: 12px; }
    .food-card .meta .macro { text-align: center; font-size: .9rem; }
    .food-card .meta strong { display: block; font-size: 1.1rem; margin-top: 6px; }
    .recipe-link { margin-top: 6px; display: inline-block; }
    @media (max-width: 620px) { .food-card .meta { grid-template-columns: repeat(2, minmax(110px, 1fr)); } }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="index.html">🍎 SeShatEats</a>
    <a href="diary.html">Diary</a>
    <a href="recipes.html">Recipes</a>
  </nav>

  <header>
    <p>SEARCH AND LOG FOOD</p>
    <h1>Find foods</h1>
  </header>

  <section class="card search-toolbar">
    <label for="search">Food search</label>
    <input id="search" type="text" placeholder="Chicken breast, oats, yogurt..." autocomplete="off">

    <label for="mealType">Log to meal</label>
    <select id="mealType">
      <option value="Breakfast">🍳 Breakfast</option>
      <option value="Lunch" selected>🥪 Lunch</option>
      <option value="Dinner">🍽 Dinner</option>
      <option value="Snack">🍎 Snack</option>
    </select>

    <div id="status" class="search-status" aria-live="polite">Type at least 2 characters to search.</div>
  </section>

  <div id="results" aria-live="polite"></div>

  <script>
    const escapeHtml = (value = '') => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));

    const searchBox = document.getElementById('search');
    searchBox.addEventListener('input', searchFoods);

    async function searchFoods() {
      const query = searchBox.value.trim();
      const resultsDiv = document.getElementById('results');
      const statusDiv = document.getElementById('status');

      if (query.length < 2) {
        resultsDiv.innerHTML = '';
        statusDiv.textContent = 'Type at least 2 characters to search.';
        return;
      }

      statusDiv.textContent = 'Searching…';
      const { data, error } = await supabaseClient
        .from('usda_foods')
        .select('*')
        .ilike('item_name', `${query}%`)
        .limit(25);

      if (error) {
        console.error(error);
        statusDiv.textContent = 'Search failed.';
        return;
      }

      statusDiv.textContent = `${(data || []).length} food(s) found`;

      if (!data || !data.length) {
        resultsDiv.innerHTML = '<div class="card"><p>No foods matched your search. Try a broader word or add a new food from the curator.</p></div>';
        return;
      }

      resultsDiv.innerHTML = data.map(food => `
        <article class="card food-card">
          <h2>${escapeHtml(food.item_name)}</h2>
          <div class="meta">
            <div class="macro">Calories<strong>${Number(food.calories || 0)}</strong></div>
            <div class="macro">Protein<strong>${Number(food.protein_g || 0)}g</strong></div>
            <div class="macro">Carbs<strong>${Number(food.carbs_g || 0)}g</strong></div>
            <div class="macro">Fat<strong>${Number(food.fat_g || 0)}g</strong></div>
          </div>
          <div style="margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
            <button type="button" onclick="addFood(${food.id})">➕ Add to diary</button>
            <a class="recipe-link" href="recipes.html">Build a recipe</a>
          </div>
        </article>
      `).join('');
    }

    async function addFood(foodId) {
      const { data: food, error: foodError } = await supabaseClient
        .from('usda_foods')
        .select('*')
        .eq('id', foodId)
        .single();

      if (foodError) {
        console.error(foodError);
        alert('Could not find that food.');
        return;
      }

      const mealType = document.getElementById('mealType').value;
      const { error } = await supabaseClient.from('food_logs').insert({
        food_id: food.id,
        servings: 1,
        meal_type: mealType
      });

      if (error) {
        console.error(error);
        alert('Failed to add food.');
        return;
      }

      alert(`${food.item_name} added to ${mealType}.`);
      window.location.href = 'diary.html';
    }
  </script>
</body>
</html>
