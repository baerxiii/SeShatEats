<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeShatEats Search</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: auto;
      padding: 20px;
      background: #f9f9f9;
      color: #1f2d1f;
    }

    h1 { color: #2e7d32; }

    a {
      font-weight: bold;
      color: #2e7d32;
      text-decoration: none;
    }

    .card {
      background: white;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .toolbar {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .two-up {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
    }

    button {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    button.secondary {
      background: #0d5a31;
    }

    .status {
      margin-top: 8px;
      color: #555;
      font-weight: 600;
    }

    .food-card {
      background: white;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }

    .macros {
      display: grid;
      grid-template-columns: repeat(4, minmax(80px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .macro {
      background: #f1f5f2;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .macro strong {
      display: block;
      margin-top: 5px;
    }

    .small-note {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }

    @media (max-width: 620px) {
      .two-up {
        grid-template-columns: 1fr;
      }
      .macros {
        grid-template-columns: repeat(2, minmax(80px, 1fr));
      }
    }
  </style>
</head>
<body>
  <a href="index.html">🏠 Dashboard</a>
  |
  <a href="diary.html">📋 Diary</a>
  |
  <a href="recipes.html">🍲 Recipes</a>

  <h1>SeShatEats</h1>

  <div class="card toolbar">
    <h2>Barcode lookup</h2>
    <div class="two-up">
      <input id="barcodeInput" type="text" placeholder="Scan or enter a barcode" autocomplete="off" />
      <button onclick="lookupBarcode()" type="button">Lookup food</button>
    </div>
    <div id="barcodeStatus" class="status">Use a product barcode to fetch packaged food info.</div>
    <div id="barcodeResult"></div>
  </div>

  <div class="card toolbar">
    <h2>Food search</h2>
    <input id="search" type="text" placeholder="Search foods..." autocomplete="off" />
    <select id="mealType">
      <option value="Breakfast">🍳 Breakfast</option>
      <option value="Lunch" selected>🥪 Lunch</option>
      <option value="Dinner">🍽 Dinner</option>
      <option value="Snack">🍎 Snack</option>
    </select>
    <div id="status" class="status">Type at least 2 characters to search.</div>
  </div>

  <div id="results"></div>

  <script>
    const searchBox = document.getElementById('search');
    searchBox.addEventListener('input', searchFoods);

    window.currentBarcodeFood = null;

    async function lookupBarcode() {
      const code = document.getElementById('barcodeInput').value.trim();
      const status = document.getElementById('barcodeStatus');
      const result = document.getElementById('barcodeResult');

      if (!code) {
        status.textContent = 'Enter a barcode first.';
        result.innerHTML = '';
        return;
      }

      status.textContent = 'Looking up barcode…';
      result.innerHTML = '';

      try {
        const response = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json`);
        const data = await response.json();

        if (!data || !data.product || !data.product.product_name) {
          status.textContent = 'No product found for that barcode.';
          return;
        }

        const product = data.product;
        const nutriments = product.nutriments || {};

        const calories = Number(nutriments['energy-kcal_100g'] ?? nutriments['energy_100g'] ?? 0);
        const protein = Number(nutriments.proteins_100g ?? 0);
        const carbs = Number(nutriments.carbohydrates_100g ?? 0);
        const fat = Number(nutriments.fat_100g ?? 0);

        const normalizedFood = {
          item_name: product.product_name || product.generic_name || 'Open Food Facts product',
          brand: product.brands || '',
          calories,
          protein_g: protein,
          carbs_g: carbs,
          fat_g: fat,
          source: 'Open Food Facts',
          serving_size: product.serving_size || '100 g',
        };

        window.currentBarcodeFood = normalizedFood;

        result.innerHTML = `
          <div class="food-card">
            <strong>${normalizedFood.item_name}</strong>
            <div class="small-note">Brand: ${normalizedFood.brand || 'Unknown'} · Source: Open Food Facts · Serving size: ${normalizedFood.serving_size}</div>

            <div class="macros">
              <div class="macro">Calories<strong>${normalizedFood.calories || 0}</strong></div>
              <div class="macro">Protein<strong>${normalizedFood.protein_g || 0}g</strong></div>
              <div class="macro">Carbs<strong>${normalizedFood.carbs_g || 0}g</strong></div>
              <div class="macro">Fat<strong>${normalizedFood.fat_g || 0}g</strong></div>
            </div>

            <div style="margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap;">
              <button type="button" onclick="saveOpenFoodFactsProduct()">Save & add to diary</button>
            </div>
          </div>
        `;

        status.textContent = 'Open Food Facts match found.';
      } catch (error) {
        console.error(error);
        status.textContent = 'Barcode lookup failed. Check the barcode and try again.';
      }
    }

    async function saveOpenFoodFactsProduct() {
      const food = window.currentBarcodeFood;
      const mealType = document.getElementById('mealType').value;

      if (!food) {
        alert('Look up a barcode first.');
        return;
      }

      const { data, error } = await supabaseClient
        .from('usda_foods')
        .insert({
          item_name: food.item_name,
          brand: food.brand || null,
          calories: Number(food.calories || 0),
          protein_g: Number(food.protein_g || 0),
          carbs_g: Number(food.carbs_g || 0),
          fat_g: Number(food.fat_g || 0),
          data_source: food.source || 'Open Food Facts'
        })
        .select()
        .single();

      if (error) {
        console.error(error);
        alert('Could not save the food to the database: ' + error.message);
        return;
      }

      const { error: logError } = await supabaseClient
        .from('food_logs')
        .insert({
          food_id: data.id,
          servings: 1,
          meal_type: mealType
        });

      if (logError) {
        console.error(logError);
        alert('Saved the food, but failed to add it to the diary: ' + logError.message);
        return;
      }

      alert(`${food.item_name} added to your ${mealType.toLowerCase()} diary.`);
      window.location.href = 'diary.html';
    }

    async function searchFoods() {
      const query = searchBox.value.trim();
      const resultsDiv = document.getElementById('results');
      const statusDiv = document.getElementById('status');

      if (query.length < 2) {
        resultsDiv.innerHTML = '';
        statusDiv.textContent = 'Type at least 2 characters to search.';
        return;
      }

      statusDiv.textContent = 'Searching…';
      const { data, error } = await supabaseClient
        .from('usda_foods')
        .select('*')
        .ilike('item_name', `${query}%`)
        .limit(25);

      if (error) {
        console.error(error);
        statusDiv.textContent = 'Search failed.';
        return;
      }

      statusDiv.textContent = `${(data || []).length} food(s) found`;

      if (!data || !data.length) {
        resultsDiv.innerHTML = '<div class="food-card"><p>No foods matched your search. Try a broader word or add a new food via barcode lookup.</p></div>';
        return;
      }

      resultsDiv.innerHTML = data.map(food => `
        <div class="food-card">
          <strong>${food.item_name}</strong>
          <br><br>
          <div class="macros">
            <div class="macro">Calories<strong>${food.calories ?? 0}</strong></div>
            <div class="macro">Protein<strong>${food.protein_g ?? 0}g</strong></div>
            <div class="macro">Carbs<strong>${food.carbs_g ?? 0}g</strong></div>
            <div class="macro">Fat<strong>${food.fat_g ?? 0}g</strong></div>
          </div>
          <br>
          <button onclick="addFood(${food.id})">➕ Add To Diary</button>
        </div>
      `).join('');
    }

    async function addFood(foodId) {
      const { data: food, error: foodError } = await supabaseClient
        .from('usda_foods')
        .select('*')
        .eq('id', foodId)
        .single();

      if (foodError) {
        console.error(foodError);
        alert('Could not find food.');
        return;
      }

      const mealType = document.getElementById('mealType').value;
      const { error } = await supabaseClient
        .from('food_logs')
        .insert({
          food_id: food.id,
          servings: 1,
          meal_type: mealType
        });

      if (error) {
        console.error(error);
        alert('Failed to add food.');
        return;
      }

      alert(`${food.item_name} added to ${mealType}`);
    }
  </script>
</body>
</html>
