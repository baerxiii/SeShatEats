<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeShatEats</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin:auto;
    padding:20px;
    background:#f9f9f9;
}

h1{
    color:#2e7d32;
}

#search{
    width:100%;
    padding:12px;
    font-size:18px;
    border-radius:8px;
    border:1px solid #ccc;
    margin-bottom:20px;
}

.food-card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.food-name{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.macros{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-top:10px;
}

.macro{
    background:#f1f1f1;
    padding:10px;
    border-radius:8px;
    text-align:center;
}

.label{
    font-size:12px;
    color:#555;
}

.value{
    font-size:18px;
    font-weight:bold;
}

#status{
    color:#666;
    margin-bottom:15px;
}

</style>
</head>
<body>

<h1>SeShatEats</h1>

<input
    id="search"
    type="text"
    placeholder="Search foods (chicken, eggs, rice, beef...)"
/>

<div id="status">
    Type at least 2 characters to search.
</div>

<div id="results"></div>

<script>

const searchBox =
    document.getElementById("search");

searchBox.addEventListener(
    "input",
    searchFoods
);

async function searchFoods(){

    const query =
        searchBox.value.trim();

    const resultsDiv =
        document.getElementById("results");

    const statusDiv =
        document.getElementById("status");

    if(query.length < 2){

        resultsDiv.innerHTML = "";

        statusDiv.innerHTML =
            "Type at least 2 characters to search.";

        return;
    }

    statusDiv.innerHTML =
        "Searching...";

const { data, error } =
await supabaseClient
    .from("usda_foods")
    .select("*")
    .ilike(
        "item_name",
        `${query}%`
    )
    .limit(25);

    if(error){

        console.error(error);

        statusDiv.innerHTML =
            "Search failed.";

        return;
    }

    statusDiv.innerHTML =
        `${data.length} food(s) found`;

    let html = "";

    data.forEach(food => {

        html += `
        <div class="food-card">

            <div class="food-name">
                ${food.item_name}
            </div>

            <div>
                Food Type:
                ${food.data_type || "Unknown"}
            </div>

            <div class="macros">

                <div class="macro">
                    <div class="label">
                        Calories
                    </div>

                    <div class="value">
                        ${food.calories ?? 0}
                    </div>
                </div>

                <div class="macro">
                    <div class="label">
                        Protein
                    </div>

                    <div class="value">
                        ${food.protein_g ?? 0}g
                    </div>
                </div>

                <div class="macro">
                    <div class="label">
                        Carbs
                    </div>

                    <div class="value">
                        ${food.carbs_g ?? 0}g
                    </div>
                </div>

                <div class="macro">
                    <div class="label">
                        Fat
                    </div>

                    <div class="value">
                        ${food.fat_g ?? 0}g
                    </div>
                </div>

                                <div class="macro">
                    <div class="label">
                        Fiber
                    </div>

                    <div class="value">
                        ${food.fiber_g ?? 0}g
                    </div>
                </div>

            </div>

            <br>

            <button onclick="addFood(${food.id})">
                ➕ Add To Diary
            </button>

        </div>
        `;
    });

    resultsDiv.innerHTML = html;
}

    async function addFood(foodId) {

    const { data: food, error: foodError } =
        await supabaseClient
            .from("usda_foods")
            .select("*")
            .eq("id", foodId)
            .single();

    if (foodError) {

        console.error(foodError);

        alert("Could not find food.");

        return;
    }

    const { error } =
        await supabaseClient
            .from("food_logs")
            .insert({
                food_id: food.id,
                servings: 1,
                meal_type: "Lunch"
            });

    if (error) {

        console.error(error);

        alert("Failed to add food.");

        return;
    }

    alert(
        `${food.item_name} added to diary`
    );
}

</script>

</body>
</html>
