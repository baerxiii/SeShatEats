<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SeShatEats Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

h1{
    color:#2e7d32;
}

a{
    color:#2e7d32;
    text-decoration:none;
    font-weight:bold;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.stats{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(200px,1fr));

    gap:15px;
}

.stat{
    background:#fafafa;
    padding:15px;
    border-radius:10px;
}

.big{
    font-size:32px;
    font-weight:bold;
}

.category-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(180px,1fr));

    gap:10px;
}

.category-btn{
    border:none;
    padding:15px;
    border-radius:10px;
    cursor:pointer;
    background:#2e7d32;
    color:white;
    font-size:16px;
}

.category-btn:hover{
    background:#1b5e20;
}

.food-row{
    padding:10px;
    border-bottom:1px solid #eee;
}

dialog{
    border:none;
    border-radius:12px;
    padding:25px;
    width:450px;
}

select{
    width:100%;
    padding:10px;
    margin-top:10px;
    margin-bottom:15px;
}

button{
    cursor:pointer;
}

</style>

</head>
<body>

<h1>🍎 SeShatEats</h1>

<a href="search.html">
🔍 Search Foods
</a>

|

<a href="diary.html">
📋 Diary
</a>

<br><br>

<div class="card">

<h2>Today's Totals</h2>

<div class="stats">

<div class="stat">
<div>Calories</div>
<div class="big" id="calories">0</div>
</div>

<div class="stat">
<div>Protein</div>
<div class="big" id="protein">0g</div>
</div>

<div class="stat">
<div>Carbs</div>
<div class="big" id="carbs">0g</div>
</div>

<div class="stat">
<div>Fat</div>
<div class="big" id="fat">0g</div>
</div>

</div>

</div>

<div class="card">

<h2>🔥 Quick Add Foods</h2>

<div class="category-grid">

<button
class="category-btn"
onclick="openCategory('Protein')">
🥩 Protein
</button>

<button
class="category-btn"
onclick="openCategory('Dairy')">
🥛 Dairy
</button>

<button
class="category-btn"
onclick="openCategory('Fruit')">
🍎 Fruit
</button>

<button
class="category-btn"
onclick="openCategory('Vegetable')">
🥦 Vegetables
</button>

<button
class="category-btn"
onclick="openCategory('Grain')">
🍚 Grains
</button>

<button
class="category-btn"
onclick="openCategory('Seafood')">
🐟 Seafood
</button>

</div>

</div>

<div class="card">

<h2>📋 Recently Logged</h2>

<div id="recentFoods">
Loading...
</div>

</div>

<dialog id="foodDialog">

<h2 id="dialogTitle">
Select Food
</h2>

<select id="foodSelect">
</select>

<button onclick="addSelectedFood()">
Add Food
</button>

<button onclick="closeDialog()">
Cancel
</button>

</dialog>

<script>

let currentFoods = [];

loadDashboard();

async function openCategory(category){

    const { data , error } =
        await supabaseClient
            .from("curated_foods")
            .select("*")
            .eq(
                "category",
                category
            )
            .order(
                "search_name"
            );

    if(error){

        console.error(error);

        return;
    }

    currentFoods = data;

    const select =
        document.getElementById(
            "foodSelect"
        );

    select.innerHTML = "";

    data.forEach(food => {

        select.innerHTML += `
        <option value="${food.usda_food_id}">
            ${food.search_name} (${food.category})
        </option>
        `;
    });

    document
        .getElementById(
            "dialogTitle"
        )
        .innerText =
        category;

    document
        .getElementById(
            "foodDialog"
        )
        .showModal();
}

function closeDialog(){

    document
        .getElementById(
            "foodDialog"
        )
        .close();
}

async function addSelectedFood(){

    const foodId =
        Number(
            document
                .getElementById(
                    "foodSelect"
                )
                .value
        );

    const { error } =
        await supabaseClient
            .from("food_logs")
            .insert({
                food_id: foodId,
                servings: 1,
                meal_type: "Lunch"
            });

    if(error){

        console.error(error);

        alert(error.message);

        return;
    }

    location.reload();
}

async function loadDashboard(){

    const today =
        new Date()
            .toISOString()
            .split("T")[0];

    const { data: logs } =
        await supabaseClient
            .from("food_logs")
            .select("*")
            .eq(
                "log_date",
                today
            )
            .order(
                "created_at",
                { ascending:false }
            );

    let calories = 0;
    let protein = 0;
    let carbs = 0;
    let fat = 0;

    let html = "";

    for(const log of logs){

        const { data: food } =
            await supabaseClient
                .from("usda_foods")
                .select("*")
                .eq(
                    "id",
                    log.food_id
                )
                .single();

        if(!food)
            continue;

        calories +=
            Number(food.calories || 0);

        protein +=
            Number(food.protein_g || 0);

        carbs +=
            Number(food.carbs_g || 0);

        fat +=
            Number(food.fat_g || 0);

        html += `
        <div class="food-row">

            <strong>
                ${food.item_name}
            </strong>

            <br>

            ${food.calories}
            calories

            •

            ${log.meal_type}

        </div>
        `;
    }

    document
        .getElementById(
            "recentFoods"
        )
        .innerHTML =
        html ||
        "No foods logged today.";

    document
        .getElementById(
            "calories"
        )
        .innerText =
        calories.toFixed(0);

    document
        .getElementById(
            "protein"
        )
        .innerText =
        protein.toFixed(1) + "g";

    document
        .getElementById(
            "carbs"
        )
        .innerText =
        carbs.toFixed(1) + "g";

    document
        .getElementById(
            "fat"
        )
        .innerText =
        fat.toFixed(1) + "g";
}

</script>

</body>
</html>
