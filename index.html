<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeShatEats Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

a{
    text-decoration:none;
    color:#2e7d32;
    font-weight:bold;
}

h1{
    color:#2e7d32;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

.stat{
    background:#fafafa;
    padding:15px;
    border-radius:10px;
}

.big{
    font-size:36px;
    font-weight:bold;
}

.quick-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
}

.quick-btn{
    border:none;
    padding:15px;
    border-radius:10px;
    cursor:pointer;
    background:#2e7d32;
    color:white;
    font-size:16px;
}

.quick-btn:hover{
    background:#1b5e20;
}

.food-row{
    padding:10px;
    border-bottom:1px solid #eee;
}

dialog{
    border:none;
    border-radius:12px;
    padding:25px;
    width:450px;
}

select{
    width:100%;
    padding:10px;
    margin-top:10px;
    margin-bottom:15px;
}

.modal-buttons button{
    margin-right:10px;
}

</style>
</head>

<body>

<h1>🍎 SeShatEats</h1>

<a href="search.html">🔍 Search Foods</a>
|
<a href="diary.html">📋 Diary</a>

<br><br>

<div class="card">

<h2>Today's Totals</h2>

<div class="stats">

<div class="stat">
<div>Calories</div>
<div class="big" id="calories">0</div>
</div>

<div class="stat">
<div>Protein</div>
<div class="big" id="protein">0</div>
</div>

<div class="stat">
<div>Carbs</div>
<div class="big" id="carbs">0</div>
</div>

<div class="stat">
<div>Fat</div>
<div class="big" id="fat">0</div>
</div>

</div>

</div>

<div class="card">

<h2>🔥 Quick Add Foods</h2>

<div class="quick-grid">

<button class="quick-btn" onclick="openDialog('proteinDialog')">
🥩 Protein
</button>

<button class="quick-btn" onclick="openDialog('dairyDialog')">
🥛 Dairy
</button>

<button class="quick-btn" onclick="openDialog('fruitDialog')">
🍎 Fruit
</button>

<button class="quick-btn" onclick="openDialog('vegetableDialog')">
🥦 Vegetables
</button>

<button class="quick-btn" onclick="openDialog('grainDialog')">
🍚 Grains
</button>

<button class="quick-btn" onclick="openDialog('seafoodDialog')">
🐟 Seafood
</button>

</div>

</div>

<div class="card">

<h2>📋 Recently Logged</h2>

<div id="recentFoods">
Loading...
</div>

</div>

<!-- PROTEIN -->

<dialog id="proteinDialog">

<h2>🥩 Protein</h2>

<select id="proteinSelect">

<option value="5913">Egg (Hard Boiled)</option>

<option value="4672">Egg White</option>

<option value="3629">Chicken Breast</option>

<option value="3565">Chicken Thigh</option>

<option value="3566">Chicken Breast (Raw)</option>

</select>

<button onclick="addFromSelect('proteinSelect','proteinDialog')">
Add
</button>

<button onclick="closeDialog('proteinDialog')">
Cancel
</button>

</dialog>

<!-- DAIRY -->

<dialog id="dairyDialog">

<h2>🥛 Dairy</h2>

<select id="dairySelect">

<option value="1">Whole Milk</option>

<option value="2">2% Milk</option>

<option value="3">Greek Yogurt</option>

<option value="4">Cottage Cheese</option>

</select>

<button onclick="addFromSelect('dairySelect','dairyDialog')">
Add
</button>

<button onclick="closeDialog('dairyDialog')">
Cancel
</button>

</dialog>

<!-- FRUIT -->

<dialog id="fruitDialog">

<h2>🍎 Fruit</h2>

<select id="fruitSelect">

<option value="5">Banana</option>

<option value="6">Apple</option>

<option value="7">Orange</option>

<option value="8">Blueberries</option>

</select>

<button onclick="addFromSelect('fruitSelect','fruitDialog')">
Add
</button>

<button onclick="closeDialog('fruitDialog')">
Cancel
</button>

</dialog>

<!-- VEGETABLES -->

<dialog id="vegetableDialog">

<h2>🥦 Vegetables</h2>

<select id="vegetableSelect">

<option value="9">Broccoli</option>

<option value="10">Carrots</option>

<option value="11">Spinach</option>

<option value="12">Cauliflower</option>

</select>

<button onclick="addFromSelect('vegetableSelect','vegetableDialog')">
Add
</button>

<button onclick="closeDialog('vegetableDialog')">
Cancel
</button>

</dialog>

<!-- GRAINS -->

<dialog id="grainDialog">

<h2>🍚 Grains</h2>

<select id="grainSelect">

<option value="13">White Rice</option>

<option value="14">Brown Rice</option>

<option value="15">Oatmeal</option>

<option value="16">Potato</option>

</select>

<button onclick="addFromSelect('grainSelect','grainDialog')">
Add
</button>

<button onclick="closeDialog('grainDialog')">
Cancel
</button>

</dialog>

<!-- SEAFOOD -->

<dialog id="seafoodDialog">

<h2>🐟 Seafood</h2>

<select id="seafoodSelect">

<option value="17">Salmon</option>

<option value="18">Tuna</option>

<option value="19">Cod</option>

<option value="20">Shrimp</option>

</select>

<button onclick="addFromSelect('seafoodSelect','seafoodDialog')">
Add
</button>

<button onclick="closeDialog('seafoodDialog')">
Cancel
</button>

</dialog>

<script>

loadDashboard();

function openDialog(id){
    document.getElementById(id).showModal();
}

function closeDialog(id){
    document.getElementById(id).close();
}

async function addFromSelect(selectId, dialogId){

    const foodId =
        document.getElementById(selectId).value;

    await quickAddFood(foodId);

    closeDialog(dialogId);
}

async function quickAddFood(foodId){

    const { error } =
        await supabaseClient
            .from("food_logs")
            .insert({
                food_id:Number(foodId),
                servings:1,
                meal_type:"Lunch"
            });

    if(error){

        console.error(error);

        alert(error.message);

        return;
    }

    location.reload();
}

async function loadDashboard(){

    const today =
        new Date()
        .toISOString()
        .split("T")[0];

    const { data: logs } =
        await supabaseClient
            .from("food_logs")
            .select("*")
            .eq("log_date", today)
            .order(
                "created_at",
                { ascending:false }
            );

    let calories = 0;
    let protein = 0;
    let carbs = 0;
    let fat = 0;

    let html = "";

    for(const log of logs){

        const { data: food } =
            await supabaseClient
                .from("usda_foods")
                .select("*")
                .eq("id", log.food_id)
                .single();

        if(!food) continue;

        calories += Number(food.calories || 0);
        protein += Number(food.protein_g || 0);
        carbs += Number(food.carbs_g || 0);
        fat += Number(food.fat_g || 0);

        html += `
        <div class="food-row">

            <strong>
                ${food.item_name}
            </strong>

            <br>

            ${food.calories} calories

            •

            ${log.meal_type}

        </div>
        `;
    }

    document.getElementById("recentFoods").innerHTML =
        html || "No foods logged today.";

    document.getElementById("calories").innerText =
        calories.toFixed(0);

    document.getElementById("protein").innerText =
        protein.toFixed(1) + "g";

    document.getElementById("carbs").innerText =
        carbs.toFixed(1) + "g";

    document.getElementById("fat").innerText =
        fat.toFixed(1) + "g";
}

</script>

</body>
</html>
